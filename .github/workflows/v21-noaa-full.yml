name: Pilot v2.1 — NOAA public-data controlled experiment
on:
  push:
    branches: [research/event-impact-aware-qc-v2-1]
    paths:
      - '.github/workflows/v21-noaa-full.yml'
  workflow_dispatch:
jobs:
  noaa-v21:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Public NOAA Daily01 reference + synthetic QC/reviews
        run: python run_v21.py --mode real --stations 12 --reps 6 --bootstrap 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v21-noaa-robustness-results
          path: outputs/V21_NOAA_CONTROLLED/
          if-no-files-found: warn
