name: V2 event-impact review — tests and synthetic smoke
on:
  push:
    branches:
      - research/event-impact-aware-qc-v2
    paths:
      - 'src/heatqc/**'
      - 'tests/**'
      - 'run_v2.py'
      - '.github/workflows/v2-tests.yml'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'src/heatqc/**'
      - 'tests/**'
      - 'run_v2.py'
      - '.github/workflows/v2-tests.yml'
  workflow_dispatch:
jobs:
  pilot-v2-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Offline test suite (v1 and v2)
        run: python -m unittest discover -s tests -v
      - name: Smoke — SYNTHETIC demo only
        run: python run_v2.py --mode demo --stations 3 --reps 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-synthetic-demo-diagnostics
          path: outputs/V2_DEMO_SYNTHETIC/
          if-no-files-found: warn
